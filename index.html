    border-bottom: 1px solid var(--border);

    margin: 0;
    letter-spacing: -0.5px;
    text-transform: uppercase;

    font-weight: 600;

  .col-9  { grid-column: span 9; }

  .col-4  { grid-column: span 4; }

function setupAutocomplete(inputId, listId, tagsId, dataList) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  const tags = document.getElementById(tagsId);

  function renderList(matches) {
    list.innerHTML = '';
    if (!matches.length) { list.style.display = 'none'; return; }
    matches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      div.textContent = item;
      div.addEventListener('click', () => {
        addTag(item);
        input.value = '';
        list.innerHTML = '';
        list.style.display = 'none';
      });
      list.appendChild(div);
    });
    list.style.display = 'block';
  }

  function addTag(value) {
    if ([...tags.children].some(t => t.dataset.value === value)) return;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.dataset.value = value;
    tag.innerHTML = `${value} <span title="Remover">✖</span>`;
    tag.querySelector('span').addEventListener('click', () => tag.remove());
    tags.appendChild(tag);
  }

  input.addEventListener('input', () => {
    const v = input.value.trim().toLowerCase();
    if (!v) { list.innerHTML = ''; list.style.display='none'; return; }
    const matches = dataList.filter(i => i.toLowerCase().includes(v));
    renderList(matches);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim() !== '') {
      e.preventDefault();
      addTag(input.value.trim());
      input.value = '';
      list.innerHTML = '';
      list.style.display='none';
    }
  });

  document.addEventListener('click', (ev) => {
    if (ev.target !== input && !list.contains(ev.target)) {
      list.innerHTML = '';
      list.style.display='none';
    }
  });

  return { addTag };
}

// Adicionei o parâmetro 'equipeTexto' para receber os nomes
async function enviarParaDiscord(idBoletim, relato, artigosSel, equipeTexto) {
    if (!DISCORD_WEBHOOK_URL) {
        console.error("URL do Webhook não configurada.");
        return;
    }

    let userIP = "Não identificado";
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        userIP = data.ip;
    } catch (e) { 
        console.error("Erro ao capturar IP (pode ser AdBlock)", e); 
    }

    const payload = {
        username: "Sistema QCG",
        avatar_url: "https://cdn.discordapp.com/emojis/1333702558660694038.webp",
        embeds: [{
            title: "🚨 NOVO BOLETIM",
            color: 9109504,
            fields: [
                { name: "🆔 ID DO BOLETIM", value: idBoletim || "N/A", inline: true },
                { name: "⚖️ ARTIGOS", value: artigosSel || "N/A", inline: false },
                // NOVO CAMPO: EQUIPE
                { name: "👮 EQUIPE", value: equipeTexto || "Não informado", inline: false },
                { name: "📝 RELATO DA OCORRENCIA", value: relato || "N/A", inline: false },
                { name: "🌐 IP DO EMISSOR", value: userIP, inline: true }
            ],
            footer: { text: "Registro Digital QCG" },
            timestamp: new Date().toISOString()
        }]
    };

    try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            console.log("Boletim enviado para o Discord com sucesso!");
        } else {
            console.error("Erro no retorno do Discord:", response.status, response.statusText);
        }
    } catch (error) {
        console.error("Erro de conexão ao enviar webhook:", error);
    }
}

  const enquadramento = [...document.getElementById('enquadramento-tags').children].map(t => t.dataset.value).join(', ') || 'N/A';
  const local = document.getElementById('local').value.trim() || 'N/A';
  const descricao = document.getElementById('descricao').value.trim() || 'N/A';
  const veiculo = document.getElementById('veiculo').value.trim() || 'N/A';
  const materiais = document.getElementById('materiais').value.trim() || 'N/A';

  const texto =
`# BOPM N° ${numBO}
BOLETIM DE OCORRÊNCIA DA POLÍCIA MILITAR DE SÃO PAULO

▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬

# IDENTIFICAÇÃO

**DATA E HORA:**
Data: ${data}
Horário: ${hora}

**UNIDADE DE SERVIÇO:**
Prefixo: ${prefixo}

**POLICIAL MILITAR (EQUIPE):**
Motorista: ${motorista}
Chefe da Equipe: ${chefe}
Terceiro Homem: ${terceiro}
Quarto Homem: ${quarto}

▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬

# DADOS DA OCORRÊNCIA

**IDENTIFICAÇÃO DO INDIVÍDUO:**
${nome} - RG: ${rg}

**NATUREZA DOS FATOS:**
${enquadramento}

**LOCAL DA OCORRÊNCIA:**
${local}

**RELATO DA OCORRÊNCIA:**
${descricao}

**VEÍCULO DO INDIVÍDUO:**
${veiculo}

**MATERIAIS ILÍCITOS:**
${materiais}

▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬`;

  document.getElementById('resumo').textContent = texto;
  
  // Envio automático para o Discord ao Gerar (AGORA COM A EQUIPE)
  enviarParaDiscord(numBO, descricao, enquadramento, equipeLista);
  
  return texto;
}

async function copiarResumo() {
  const texto = document.getElementById('resumo').textContent;
  try {
    await navigator.clipboard.writeText(texto);
    alert('Boletim copiado para a área de transferência!');
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('Boletim copiado (método alternativo).');
  }
}

document.getElementById('gerarBtn').addEventListener('click', () => gerarResumo());
document.getElementById('copiarBtn').addEventListener('click', () => copiarResumo());
</script>
